version: 0.2

phases:
  pre_build:
    commands:
      - test -n "$AWS_DEFAULT_REGION"
      - test -n "$ECR_REPOSITORY"
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      - docker build --pull -t "$ECR_REGISTRY/$ECR_REPOSITORY:preview" .
  post_build:
    commands:
      - docker push "$ECR_REGISTRY/$ECR_REPOSITORY:preview"
      - printf 'Published image: %s\n' "$ECR_REGISTRY/$ECR_REPOSITORY:preview"
