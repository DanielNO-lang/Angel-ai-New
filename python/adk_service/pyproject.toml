[project]
name = "angel-adk-bridge"
version = "0.1.0"
description = "Optional external Google ADK Python runtime for Angel AI"
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-adk[mcp]>=2.12.0,<2.13",
  "sqlalchemy[asyncio]>=2.0.0,<3",
  "asyncpg>=0.29.0,<1",
  "greenlet>=3.0.0,<4",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
]

[tool.uv]
package = false
