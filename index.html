    <script>
      // Gracefully silence benign Vite HMR WebSocket connection closed notifications when HMR is disabled in AI Studio
      window.addEventListener('unhandledrejection', function(event) {
        var msg = String((event.reason && (event.reason.message || event.reason)) || '');
        if (msg.indexOf('WebSocket') !== -1 && msg.indexOf('closed') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = String(event.message || '');
        if (msg.indexOf('WebSocket') !== -1 && msg.indexOf('closed') !== -1) {
          event.preventDefault();
        }
      });

      // OAuth popup callback relay: if this window was opened as a popup by Angel AI,
      // relay the hash tokens or error to the parent window and close itself.
      try {
        if (window.opener) {
          // OAuth callbacks are handled by Supabase's supported session flow; do not relay tokens cross-origin.
        }
      } catch (e) {}
    </script>
