# Angel AI New: Netlify build and API routing
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # The generated server entry is CommonJS (.cjs), matching the explicit runtime format.
  # Keep Vite's optional dev-time imports out of the serverless function bundle.
  external_node_modules = ["express", "serverless-http", "@supabase/supabase-js", "@google/genai", "dotenv"]
  included_files = ["server-build/server.cjs"]

# Keep the original /api/* path so Express's /api/... routes continue to match.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Vite SPA route fallback; keep after the API rewrite.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
