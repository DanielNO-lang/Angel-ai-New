name: Angel CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/filtered-angel-backend-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Browser worker policy tests
        run: |
          npm install --prefix browser-worker --no-audit --no-fund
          npm test --prefix browser-worker
      - name: Type-check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
