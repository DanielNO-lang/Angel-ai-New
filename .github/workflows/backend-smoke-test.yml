name: Backend smoke test

on:
  push:
    branches: [main]
    paths:
      - 'server.ts'
      - 'server/**'
      - 'api/**'
      - 'package.json'
      - 'vercel.json'
      - 'scripts/backend-smoke.mjs'
      - '.github/workflows/backend-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: angel-backend-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for deployment and verify live backend
        id: smoke
        env:
          GITHUB_SHA: ${{ github.sha }}
          ANGEL_BASE_URL: https://angel-ai-new-git-main-angel-0908.vercel.app
        run: node scripts/backend-smoke.mjs

      - name: Publish backend smoke status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.smoke.outcome }}';
            const state = outcome === 'success' ? 'success' : outcome === 'cancelled' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'Angel Backend Smoke Test',
              description: state === 'success' ? 'Production API and live Gemini generation passed' : String('${{ steps.smoke.outputs.reason }}' || 'Smoke test failed; inspect Actions logs').slice(0, 140),
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });
