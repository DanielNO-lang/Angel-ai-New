name: Angel CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: angel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: Type-check
        run: npm run lint
      - name: Build application
        run: npm run build
