name: Angel branch build
on:
  push:
    branches:
      - 'fix/angel-vercel-ui-model-2026-10-03'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
