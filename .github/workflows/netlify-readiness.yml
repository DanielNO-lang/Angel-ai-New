name: Netlify readiness check

on:
  push:
    branches:
      - migration/netlify-preview
      - research/angel-capability-audit-2026-10-17
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and backend smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check application and backend
        run: npm run lint
      - name: Run backend smoke tests
        run: npm test
      - name: Build client and server bundles
        run: npm run build
