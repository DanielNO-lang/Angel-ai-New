name: Python capability service checks

on:
  pull_request:
    branches: ["**"]
    paths:
      - "python/adk_service/**"
      - "python/sandbox_service/**"
      - ".github/workflows/python-capability-check.yml"
  push:
    branches: ["**"]
    paths:
      - "python/adk_service/**"
      - "python/sandbox_service/**"
      - ".github/workflows/python-capability-check.yml"

jobs:
  compile-python-services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "python/adk_service/pyproject.toml"

      - name: Install the external ADK runtime dependencies
        run: uv sync --project python/adk_service

      - name: Compile Python services
        run: python -m compileall -q python/adk_service python/sandbox_service

      - name: Verify ADK package imports and app initialization
        working-directory: python/adk_service
        env:
          ANGEL_ADK_SERVICE_TOKEN: test-only-local-ci-token
        run: uv run --project . python -c "import main; assert main.app.title == 'Angel ADK Bridge'; assert main.health.__name__ == 'health'"
