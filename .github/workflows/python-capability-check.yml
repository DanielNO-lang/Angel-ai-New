name: Python capability service checks

on:
  pull_request:
    branches: ["**"]
  push:
    branches:
      - "**"

jobs:
  compile-python-services:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile ADK bridge and isolated Python sandbox
        run: python -m compileall -q python/adk_service python/sandbox_service
