name: Angel branch verification

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: angel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --no-save

      - name: Type-check
        run: bun run lint

      - name: Build application and ESM server bundle
        run: bun run build

      - name: Run tests against the built server bundle
        run: bun run test

      - name: Bundle Netlify function entrypoint without deployment
        run: bunx esbuild netlify/functions/api.ts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/angel-netlify-api.mjs
